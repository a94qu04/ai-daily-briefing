name: Daily AI News Briefing

on:
  schedule:
    # 每天 UTC 02:13（台灣時間早上 10:13）自動執行，避開整點尖峰延遲
    - cron: "13 2 * * *"
  workflow_dispatch:
    inputs:
      target_dates:
        description: "選填：指定要回補的台灣日期（支援逗號分隔或 YYYY-MM-DD..YYYY-MM-DD 區間，留空則抓取今日）"
        required: false
        default: ""
      relink_dates:
        description: "選填：為既有的 archive.json 日期補齊 60 天相關舊聞脈絡（逗號分隔或區間，單次呼叫完成）"
        required: false
        default: ""
      batch_days:
        description: "選填：每次 API 呼叫合併處理天數（1～7，回補多日時建議設為 5 以節省配額）"
        required: false
        default: "1"
      skip_existing:
        description: "選填：回補時是否自動略過 archive.json 已存在的日期"
        type: boolean
        required: false
        default: false
      build_assets_only:
        description: "選填：僅重新產出 sitemap.xml（不呼叫 Gemini API）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-ai-briefing
  cancel-in-progress: false

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and summarize daily AI news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          TARGET_DATES: ${{ inputs.target_dates }}
          RELINK_DATES: ${{ inputs.relink_dates }}
          BATCH_DAYS: ${{ inputs.batch_days }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.build_assets_only }}" = "true" ]; then
            python fetch_news.py --build-assets
          else
            python fetch_news.py
          fi

      - name: Commit and push updated archive and sitemap
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json sitemap.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "archive.json / sitemap.xml 無變更，略過 commit。"
          else
            TODAY_TW=$(TZ="Asia/Taipei" date +"%Y-%m-%d")
            git commit -m "chore: 更新每日 AI 新聞簡報與索引檔 (${TODAY_TW})"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi
