name: Daily AI News Briefing

on:
  schedule:
    # 每天 UTC 02:00（台灣時間早上 10:00）自動執行
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target_dates:
        description: "選填：指定要回補的台灣日期（YYYY-MM-DD，多日以逗號分隔，留空則抓取今日）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai pydantic

      - name: Fetch and summarize daily AI news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATES: ${{ inputs.target_dates }}
        run: python fetch_news.py

      - name: Commit and push updated archive.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json
          if git diff --staged --quiet; then
            echo "archive.json 無變更，略過 commit。"
          else
            TODAY_TW=$(TZ="Asia/Taipei" date +"%Y-%m-%d")
            git commit -m "chore: 更新每日 AI 新聞簡報 (${TODAY_TW})"
            git push
          fi
